# TEMPORARY benchmark for the ffmpeg PR — removed before review. No secrets, no R2/Telegram/admin.
name: ffmpeg bench (temp)
on:
  pull_request:
env:
  FFMPEG_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
  FFMPEG_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
jobs:
  static-cached:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preinstalled ffmpeg?
        run: command -v ffmpeg && ffmpeg -version | sed -n 1p || echo "ffmpeg NOT preinstalled"
      # Static ffmpeg (johnvansickle 7.0.2), cached across runs. apt pulled ~105 MB
      # from the Azure Ubuntu mirror and took 5–20 min when the mirror was slow.
      # Has every filter enhance-audio.ts uses (loudnorm, afftdn, arnndn, …) + aac.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ env.FFMPEG_SHA256 }}

      - name: System deps (ffmpeg)
        run: |
          set -euo pipefail
          dir="$HOME/.local/ffmpeg"
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            if curl -fsSL --retry 3 --max-time 120 -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL" \
              && echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -; then
              tar -xJf /tmp/ffmpeg.tar.xz -C "$dir" --strip-components=1 --wildcards '*/ffmpeg'
            else
              # Upstream moved/changed or is down: old apt path (nothing gets cached).
              echo "::warning::Static ffmpeg download failed; falling back to apt"
              rm -rf "$dir"
              sudo apt-get update
              sudo apt-get install -y ffmpeg
              exit 0
            fi
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -version | sed -n 1p

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify filters + encoders and run enhance tests
        run: |
          which ffmpeg
          for f in loudnorm afftdn arnndn highpass equalizer acompressor alimiter aformat silencedetect; do
            ffmpeg -hide_banner -filters 2>/dev/null | grep -qw "$f" && echo "ok $f" || { echo "MISSING $f"; exit 1; }
          done
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E " aac | pcm_s16le "
          ffmpeg -hide_banner -decoders 2>/dev/null | grep -E " opus | vorbis "
          bun test enhance-audio.test.ts
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=f=220:d=3" -c:a libopus /tmp/in.ogg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/in.ogg -ar 48000 -ac 1 -c:a pcm_s16le /tmp/in.wav
          ffmpeg -hide_banner -loglevel error -y -i /tmp/in.wav -vn -c:a aac -b:a 96k -movflags +faststart /tmp/out.m4a
          ls -la /tmp/out.m4a
  apt-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: System deps (ffmpeg) — old apt path
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
