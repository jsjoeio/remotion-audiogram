# Podcast pipeline (CI)
#
# Default path (PREV-751 Phase 1 / app.jsjoe.io):
#   R2 download → convert → enhance → AAC → public R2 → Telegram topic with URL
#
# Full audiogram path (Whisper + Remotion + video Telegram) is commented out below.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   PUBLIC_AUDIO_BASE_URL
#   TELEGRAM_BOT_TOKEN, ALLOWED_TELEGRAM_USER_ID, TELEGRAM_GROUP_CHAT_ID

name: Podcast pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "joe/podcast-ci/**"

env:
  WHISPER_MODEL: medium
  PUBLIC_AUDIO_BUCKET: wellness-program-audio

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System deps (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: App audio (download + enhance + publish AAC + Telegram link)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_AUDIO_BASE_URL: ${{ secrets.PUBLIC_AUDIO_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USER_ID: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          if [ -n "${{ vars.PUBLIC_AUDIO_BUCKET }}" ]; then
            export PUBLIC_AUDIO_BUCKET="${{ vars.PUBLIC_AUDIO_BUCKET }}"
          fi
          bun run podcast:app

      - name: Upload processed audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podcast-audio
          path: |
            public/dialogue.raw.wav
            public/dialogue.wav
            public/*.m4a
          if-no-files-found: ignore
          retention-days: 7

      # ─── Full audiogram path (Whisper + Remotion + video Telegram) ────────
      # Commented out — uncomment to restore video delivery.

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-debug
          path: |
            public/
            .cache/
            out/
          if-no-files-found: ignore
          retention-days: 7
