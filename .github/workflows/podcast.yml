# Podcast pipeline (CI)
#
# Default path (PREV-751 Phase 1 / app.jsjoe.io):
#   R2 download → convert → enhance → AAC → public R2 (wellness-program-audio)
#
# Full audiogram path (Whisper + Remotion + Telegram) is commented out below.
# Uncomment those steps to restore video delivery; leave the app publish step
# as-is or run both.
#
# Trigger without merging to main
#   gh workflow run podcast.yml --ref <branch> -R jsjoeio/remotion-audiogram
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (R2 read telegram-voice + write wellness-program-audio)
#   CLOUDFLARE_ACCOUNT_ID
#   PUBLIC_AUDIO_BASE_URL  (optional but recommended — e.g. https://pub-….r2.dev
#                          or https://audio.jsjoe.io after custom domain)
#   PUBLIC_AUDIO_BUCKET    (optional, default wellness-program-audio)
#
# Video path only (when re-enabled):
#   TELEGRAM_BOT_TOKEN
#   ALLOWED_TELEGRAM_USER_ID
#   TELEGRAM_GROUP_CHAT_ID
#
# Optional env: PODCAST_DENOISE=afftdn|arnndn|off (default off).

name: Podcast pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "joe/podcast-ci/**"

env:
  WHISPER_MODEL: medium
  PUBLIC_AUDIO_BUCKET: wellness-program-audio

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # System ffmpeg for loudness enhance + AAC encode.
      # (Remotion's bundled ffmpeg lacks the enhance filters.)
      - name: System deps (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # R2 (telegram-voice) → enhance → AAC → public R2 (wellness-program-audio)
      - name: App audio (download + enhance + publish AAC)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Inherits PUBLIC_AUDIO_BUCKET from job env; override via repo variable if set
          PUBLIC_AUDIO_BASE_URL: ${{ secrets.PUBLIC_AUDIO_BASE_URL }}
        run: |
          if [ -n "${{ vars.PUBLIC_AUDIO_BUCKET }}" ]; then
            export PUBLIC_AUDIO_BUCKET="${{ vars.PUBLIC_AUDIO_BUCKET }}"
          fi
          bun run podcast:app

      - name: Upload processed audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podcast-audio
          path: |
            public/dialogue.raw.wav
            public/dialogue.wav
            public/*.m4a
          if-no-files-found: ignore
          retention-days: 7

      # ─── Full audiogram path (Whisper + Remotion + Telegram) ─────────────
      # Commented out for app.jsjoe.io Phase 1. To restore video delivery:
