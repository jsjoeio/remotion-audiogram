# Phase 0: run the full podcast pipeline on demand.
# Trigger: Actions UI → "Podcast pipeline" → Run workflow
#        or: gh workflow run podcast.yml
# Secrets required (repo Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN
#   ALLOWED_TELEGRAM_USER_ID
#   CLOUDFLARE_API_TOKEN   (R2 read on bucket telegram-voice)
#   CLOUDFLARE_ACCOUNT_ID

name: Podcast pipeline

on:
  workflow_dispatch:

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System deps (cmake for whisper, Chrome libs for Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libpango-1.0-0 \
            libcairo2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache whisper.cpp + model
        uses: actions/cache@v4
        with:
          path: whisper.cpp
          key: whisper-1.7.4-medium-${{ runner.os }}
          restore-keys: |
            whisper-1.7.4-medium-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Run podcast pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USER_ID: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run podcast

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-debug
          path: |
            public/captions.json
            out/
          if-no-files-found: ignore
          retention-days: 7
