# Podcast pipeline (CI)
#
# Default path (PREV-751 Phase 1 / app.jsjoe.io):
#   R2 download → convert → enhance → AAC → public R2 → Telegram topic with URL
#
# Compose/admin path (PREV-775): set workflow_dispatch skip_telegram=true and
# ADMIN_PODCAST_CALLBACK_* secrets to POST the ready payload instead of Telegram.
#
# Full audiogram path (Whisper + Remotion + video Telegram) is commented out below.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   PUBLIC_AUDIO_BASE_URL
#   TELEGRAM_BOT_TOKEN, ALLOWED_TELEGRAM_USER_ID, TELEGRAM_GROUP_CHAT_ID
#   ADMIN_PODCAST_CALLBACK_URL, ADMIN_PODCAST_CALLBACK_TOKEN (optional; gradual rollout)

name: Podcast pipeline

on:
  workflow_dispatch:
    inputs:
      skip_telegram:
        description: "Skip posting the public URL to Telegram (compose/admin callback path)"
        type: boolean
        default: false
      job_id:
        description: "Optional admin job id echoed in the callback payload"
        type: string
        required: false
      meta_key:
        description: "Optional R2 meta object key (meta/.../*.json); defaults to latest under meta/"
        type: string
        required: false
  push:
    branches:
      - "joe/podcast-ci/**"

env:
  WHISPER_MODEL: medium
  PUBLIC_AUDIO_BUCKET: wellness-program-audio
  FFMPEG_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
  FFMPEG_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static ffmpeg (johnvansickle 7.0.2), cached across runs. apt pulled ~105 MB
      # from the Azure Ubuntu mirror and took 5–20 min when the mirror was slow.
      # Has every filter enhance-audio.ts uses (loudnorm, afftdn, arnndn, …) + aac.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-${{ runner.os }}-${{ env.FFMPEG_SHA256 }}

      - name: System deps (ffmpeg)
        run: |
          set -euo pipefail
          dir="$HOME/.local/ffmpeg"
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            if curl -fsSL --retry 3 --max-time 120 -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL" \
              && echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -; then
              tar -xJf /tmp/ffmpeg.tar.xz -C "$dir" --strip-components=1 --wildcards '*/ffmpeg'
            else
              # Upstream moved/changed or is down: old apt path (nothing gets cached).
              echo "::warning::Static ffmpeg download failed; falling back to apt"
              rm -rf "$dir"
              sudo apt-get update
              sudo apt-get install -y ffmpeg
              exit 0
            fi
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -version | sed -n 1p

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: App audio (download + enhance + publish AAC + Telegram link)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_AUDIO_BASE_URL: ${{ secrets.PUBLIC_AUDIO_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USER_ID: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SKIP_TELEGRAM: ${{ inputs.skip_telegram }}
          PODCAST_JOB_ID: ${{ inputs.job_id }}
          PODCAST_META_KEY: ${{ inputs.meta_key }}
          ADMIN_PODCAST_CALLBACK_URL: ${{ secrets.ADMIN_PODCAST_CALLBACK_URL }}
          ADMIN_PODCAST_CALLBACK_TOKEN: ${{ secrets.ADMIN_PODCAST_CALLBACK_TOKEN }}
        run: |
          if [ -n "${{ vars.PUBLIC_AUDIO_BUCKET }}" ]; then
            export PUBLIC_AUDIO_BUCKET="${{ vars.PUBLIC_AUDIO_BUCKET }}"
          fi
          bun run podcast:app

      - name: Upload processed audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podcast-audio
          path: |
            public/dialogue.raw.wav
            public/dialogue.wav
            public/*.m4a
          if-no-files-found: ignore
          retention-days: 7

      # ─── Full audiogram path (Whisper + Remotion + video Telegram) ────────
      # Commented out — uncomment to restore video delivery.

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-debug
          path: |
            public/
            .cache/
            out/
          if-no-files-found: ignore
          retention-days: 7
