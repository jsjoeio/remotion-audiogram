# Podcast pipeline (CI) — no local whisper.cpp / cmake.
#
# Why not bun run podcast end-to-end?
#   Local uses @remotion/install-whisper-cpp (git clone + make + ~1.5GB model).
#   On Actions that is slow and fragile. Instead we run the prebuilt
#   ghcr.io/appleboy/go-whisper image (same binary as appleboy/whisper-action),
#   then convert SRT → captions.json and render with Remotion.
#
# Why not uses: appleboy/whisper-action?
#   That is a Docker *container action* (image: Dockerfile). GitHub rebuilds it
#   at job start ("Build appleboy/whisper-action…") — ~2.5 min every run, before
#   checkout. We docker pull/load go-whisper ourselves and cache image + model.
#
# Trigger without merging to main
#   1) workflow_dispatch must exist on the default branch (already true).
#   2) Run code FROM a feature branch:
#        gh workflow run podcast.yml --ref joe/optimize-pipeline -R jsjoeio/remotion-audiogram
#      GitHub uses the workflow + source at that ref; no need to push to main.
#   3) Optional: push to branch matching joe/podcast-ci/** auto-runs (below).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN
#   ALLOWED_TELEGRAM_USER_ID
#   CLOUDFLARE_API_TOKEN   (R2 read on bucket telegram-voice)
#   CLOUDFLARE_ACCOUNT_ID

name: Podcast pipeline

on:
  workflow_dispatch:
  # Test workflow changes without merging to main: push to a ci branch.
  push:
    branches:
      - "joe/podcast-ci/**"

env:
  # Pin: same base as appleboy/whisper-action@v0.1.1 (Dockerfile FROM …:1.3.0)
  GO_WHISPER_IMAGE: ghcr.io/appleboy/go-whisper:1.3.0
  WHISPER_MODEL: medium

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Chrome/Remotion only — no cmake / build-essential (Whisper is Docker).
      - name: System deps (Chrome libs for Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libpango-1.0-0 \
            libcairo2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache go-whisper Docker image
        id: cache-go-whisper-image
        uses: actions/cache@v4
        with:
          path: /tmp/go-whisper-image.tar
          key: go-whisper-image-${{ runner.os }}-1.3.0

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-ggml-${{ env.WHISPER_MODEL }}-v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      # R2 → public/dialogue.* + public/dialogue.wav + .cache/meta
      - name: Prepare (download R2 + convert audio)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run podcast:prepare

      # Load cached image or pull once; save tar for next run (avoids action rebuild).
      - name: Load or pull go-whisper image
        run: |
          set -euo pipefail
          if [ -f /tmp/go-whisper-image.tar ]; then
            echo "Loading go-whisper image from cache…"
            docker load -i /tmp/go-whisper-image.tar
          else
            echo "Pulling ${GO_WHISPER_IMAGE}…"
            docker pull "${GO_WHISPER_IMAGE}"
            docker save "${GO_WHISPER_IMAGE}" -o /tmp/go-whisper-image.tar
          fi

      # Host-side model cache mounted into the container (same URLs as whisper-action entrypoint).
      - name: Ensure Whisper model
        run: |
          set -euo pipefail
          mkdir -p models
          model_file="models/ggml-${WHISPER_MODEL}.bin"
          if [ -f "$model_file" ]; then
            echo "Model already present: $model_file"
            ls -lh "$model_file"
            exit 0
          fi
          echo "Downloading ggml-${WHISPER_MODEL}.bin…"
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-${WHISPER_MODEL}.bin" \
            -o "$model_file"
          ls -lh "$model_file"

      - name: Transcribe with go-whisper
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/models:/app/models:ro" \
            -v "$PWD/public:/app/public" \
            "${GO_WHISPER_IMAGE}" \
            --model "/app/models/ggml-${WHISPER_MODEL}.bin" \
            --audio-path /app/public/dialogue.wav \
            --output-folder /app/public \
            --output-filename captions \
            --output-format srt \
            --print-progress true

      - name: SRT → captions.json
        run: bun run srt-to-captions

      # Render + Telegram (captions already on disk; no local whisper)
      - name: Finish (render + Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_TELEGRAM_USER_ID: ${{ secrets.ALLOWED_TELEGRAM_USER_ID }}
        run: bun run podcast:finish

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-debug
          path: |
            public/captions.srt
            public/captions.json
            out/
          if-no-files-found: ignore
          retention-days: 7
